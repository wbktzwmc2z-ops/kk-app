<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernen">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lernen unterwegs</title>
<style>
/* Layout: eine Spalte für den Daumen, Leiste unten, Karten nur für Fächer und Quizfrage. Farben wie Dashboard.html. */
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1d1f1c; --muted:#6b6f68; --line:#e4e1d8;
  --accent:#1f5f4a; --accent-soft:#e3efe9;
  --offen:#c9c6bd; --gelernt:#6f9bd1; --wackelig:#e0a33a; --sicher:#2f8a5f;
  --ok:#2f8a5f; --ok-soft:#e2f2e8; --bad:#b4532a; --bad-soft:#fbe7dd;
  --warn-bg:#fdf1dc; --warn-ink:#8a5a07;
  --radius:14px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141614; --panel:#1d201d; --ink:#ecebe6; --muted:#9a9d95; --line:#2d312c;
  --accent:#7cc4a4; --accent-soft:#1f3229;
  --offen:#4a4d47; --sicher:#47b07f;
  --ok:#6cc79a; --ok-soft:#1d3527; --bad:#e8895c; --bad-soft:#3d2419;
  --warn-bg:#3a2e14; --warn-ink:#f0c46b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141614; --panel:#1d201d; --ink:#ecebe6; --muted:#9a9d95; --line:#2d312c;
  --accent:#7cc4a4; --accent-soft:#1f3229;
  --offen:#4a4d47; --sicher:#47b07f;
  --ok:#6cc79a; --ok-soft:#1d3527; --bad:#e8895c; --bad-soft:#3d2419;
  --warn-bg:#3a2e14; --warn-ink:#f0c46b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding-block:18px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:.88em/1.4 var(--mono);padding:.08em .35em;border-radius:.35em;background:color-mix(in srgb,var(--accent) 12%,transparent);overflow-wrap:anywhere}

/* Stand-Hinweis */
.stand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stand .punkt{width:8px;height:8px;border-radius:99px;background:var(--sicher);flex:none}
.stand.alt .punkt{background:var(--wackelig)}

/* Listen */
.liste{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.liste li{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;min-width:0}
.liste li:last-child{border-bottom:0}
.liste .txt{min-width:0;flex:1}
.liste .klein{font-size:13px;color:var(--muted)}
.haken{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:13px;color:var(--panel)}
.haken.ja{background:var(--sicher);border-color:var(--sicher)}
.erledigt .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.leer{padding:14px;color:var(--muted);font-size:14px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}

/* Fachkennung */
.tag{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;
  color:color-mix(in srgb,var(--f,var(--accent)) 75%,var(--ink));background:color-mix(in srgb,var(--f,var(--accent)) 14%,transparent);white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.offen{background:color-mix(in srgb,var(--offen) 35%,transparent);color:var(--muted)}
.pill.gelernt{background:color-mix(in srgb,var(--gelernt) 20%,transparent);color:color-mix(in srgb,var(--gelernt) 70%,var(--ink))}
.pill.wackelig{background:color-mix(in srgb,var(--wackelig) 22%,transparent);color:color-mix(in srgb,var(--wackelig) 60%,var(--ink))}
.pill.sicher{background:color-mix(in srgb,var(--sicher) 18%,transparent);color:color-mix(in srgb,var(--sicher) 75%,var(--ink))}
.countdown{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.countdown.warn{background:var(--warn-bg);color:var(--warn-ink)}

/* Knöpfe */
.haupt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px 18px;border:0;border-radius:var(--radius);
  background:var(--accent);color:var(--bg);font-weight:650;font-size:17px;cursor:pointer;text-align:left}
.haupt small{display:block;font-weight:500;font-size:13px;opacity:.85}
.haupt .pfeil{font-size:22px}
.zweit{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Fächer */
.fach{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;
  border-top:4px solid var(--f)}
.fach .kopf{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fach .name{font-weight:650;font-size:16px;line-height:1.3}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--offen)}
.bar span{display:block}
.themen{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.themen li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.themen .nr{font:600 12px var(--mono);color:var(--muted);flex:none;width:22px}
.themen .t{flex:1;min-width:0}
.tknoepfe{display:inline-flex;gap:5px;flex:none}
.mini-knopf{font-family:inherit;font-size:11px;font-weight:600;line-height:1;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#suche{margin-bottom:14px}
.fortschrittsliste li.fs{display:flex;flex-direction:column;align-items:stretch;gap:7px;cursor:pointer;padding:11px 14px}
.fs-kopf{display:flex;justify-content:space-between;align-items:baseline}
.fs-zahl{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.fs-zahl small{font-weight:500;font-size:13px;color:var(--muted)}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legende i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details.schw summary{cursor:pointer;font-size:14px;color:var(--muted);padding:4px 0}
details.themenauf summary{color:var(--ink);font-weight:600;padding:8px 0}
details.themenauf .themen{margin-top:4px}
details.runde{border-top:1px solid var(--line);margin:0 -12px;padding:0 12px}
details.runde summary{display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}
details.runde summary::-webkit-details-marker{display:none}
details.runde summary .txt{flex:1;min-width:0;font-weight:400;color:var(--ink)}
details.runde summary .klein{font-size:13px;color:var(--muted)}
.rfragen{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:10px}
.haken.nein{background:var(--bad);border-color:var(--bad)}
.rfragen li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45;padding:10px;border-radius:10px;background:var(--bg);min-width:0}
.rfragen li.bad{background:var(--bad-soft)}
.rfragen .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.rfragen .klein{font-size:13px;color:var(--muted);margin-top:4px}
.rfragen .erkl{font-size:13px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.rfragen .tag{font-size:10px;padding:3px 5px}
.rfragen pre{white-space:pre-wrap;font-size:12px}
.mini{margin:4px 0 0;padding-left:1.2em}
.rfragen .mini li{display:list-item;padding:0;margin:2px 0;background:none;border-radius:0;font-size:13px}
details.quizfach{border:1px solid var(--line);border-left:4px solid var(--f);border-radius:12px;padding:6px 12px;margin:0 0 10px;background:var(--panel)}
details.quizfach summary .klein{font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
details.quizfach > .zweit{width:100%;margin:6px 0}
details.quizfach .liste{margin:0 -12px -6px;border:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
details.quizfach .liste .txt .pill, details.quizfach .liste .txt .countdown{margin-left:4px;vertical-align:1px}
details.schw ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.zettelliste li.zrow{display:block;padding:10px 0}
.zkopf{display:flex;gap:10px;align-items:baseline;font-weight:650;font-size:16px;line-height:1.3}
.zkopf .nr{font-size:13px;color:var(--f)}
.zknoepfe{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.zknoepfe .zweit{width:100%;padding:10px 8px;font-size:14px;font-weight:600}
.zknoepfe .lang{background:color-mix(in srgb,var(--f) 16%,var(--panel));border-color:color-mix(in srgb,var(--f) 40%,var(--line));color:var(--ink)}
.zknoepfe .kurz{background:var(--panel);border:1.5px dashed color-mix(in srgb,var(--f) 55%,var(--line));color:color-mix(in srgb,var(--f) 70%,var(--ink))}
.bilanz{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;gap:12px}
.bilanz-zahlen{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.bilanz-zahlen b{display:block;font-size:22px;line-height:1.1;font-weight:700}
.bilanz-zahlen span{font-size:12px;color:var(--muted)}
.bilanz-fort .klein{font-size:13px;color:var(--muted);margin:6px 0 0}
.fachliste{display:flex;flex-direction:column;gap:14px}
details.fachteil{border-top:1px solid var(--line);padding-top:4px}
details.fachteil summary{cursor:pointer;font-weight:600;font-size:15px;padding:8px 0;display:flex;align-items:center;gap:8px}
details.fachteil summary{list-style:none}
details.fachteil summary::-webkit-details-marker{display:none}
details.fachteil summary::before{content:'▸';display:inline-block;font-size:12px;color:var(--muted);width:12px;transition:transform .15s}
details.fachteil[open] summary::before{transform:rotate(90deg)}
details.fachteil summary .zahl{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
details.fachteil.neben summary{font-weight:500;color:var(--muted);font-size:14px}
details.fachteil .themen{margin:2px 0 6px}
.unterkopf{margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.schwliste{margin:0 0 6px;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.reihe{display:flex;gap:8px;flex-wrap:wrap}

/* Quiz */
.frage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.frage .meta{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.frage .text{font-size:18px;font-weight:600;line-height:1.4;text-wrap:pretty}
.fortschritt{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.fortschritt span{display:block;height:100%;background:var(--accent);transition:width .25s}
.optionen{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px;line-height:1.4}
.opt .b{font:700 13px/1.6 var(--mono);color:var(--muted);flex:none}
.opt:disabled{cursor:default}
.opt.richtig{border-color:var(--ok);background:var(--ok-soft)}
.opt.falsch{border-color:var(--bad);background:var(--bad-soft)}
.wf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wf .opt{justify-content:center;font-weight:650}
.zuo{display:flex;flex-direction:column;gap:12px}
.zuo label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.zuo select{font:inherit;font-size:15px;font-weight:400;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;max-width:100%}
.zuo select.richtig{border-color:var(--ok);background:var(--ok-soft)}
.zuo select.falsch{border-color:var(--bad);background:var(--bad-soft)}
.zuo .loes{font-weight:400;font-size:13px;color:var(--bad)}
code.block{display:block;margin:.45em 0 .1em;padding:.55em .7em;border-radius:8px;font-size:13px;line-height:1.5;font-weight:400;
  white-space:pre-wrap;overflow-wrap:anywhere;background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid var(--line)}
code.block .cz{display:block;padding-left:calc(var(--e) * 2ch + 3ch);text-indent:-3ch}
.opt > span:last-child{min-width:0;flex:1}
.opt code.block{margin:0;padding:0;border:0;background:none;font-size:12.5px}
.frage .text code.block{font-size:13.5px;margin:.6em 0}
.opt.gewaehlt{border-color:var(--accent);background:var(--accent-soft)}
.sicherheit{display:flex;flex-direction:column;gap:8px;padding-top:4px;border-top:1px dashed var(--line)}
.opt:disabled:not(.richtig):not(.falsch){opacity:.45}
.luecke{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center}
.lueckenfeld{width:100%;font:16px/1.4 var(--mono);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.lueckenfeld:focus{border-color:var(--accent);outline:none}
.eingabe-erg{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line)}
.eingabe-erg.richtig{border-color:var(--ok);background:var(--ok-soft)} .eingabe-erg.falsch{border-color:var(--bad);background:var(--bad-soft)}
.eingabe-erg code{background:none;padding:0;font-size:15px}
.karte-antwort{padding:14px;border-radius:12px;background:var(--accent-soft);font-size:16px;line-height:1.5}
.schritte,.loesung{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.loesung{padding-left:1.4em;list-style:decimal;font-size:14px;gap:4px}
.schritte .leer-hinweis{color:var(--muted);font-size:14px;padding:12px;border:1.5px dashed var(--line);border-radius:12px}
.vorrat{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.schritt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;line-height:1.4}
.schritt > span:last-child{min-width:0;flex:1}
.schritte .schritt{border-color:var(--accent);background:var(--accent-soft)}
.schritt .b{font:700 13px/1.6 var(--mono);color:var(--muted);flex:none}
.schritt.richtig{border-color:var(--ok);background:var(--ok-soft)} .schritt.falsch{border-color:var(--bad);background:var(--bad-soft)}
.schritt code.block{margin:0;padding:0;border:0;background:none;font-size:12.5px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;font:15px/1.3 var(--mono)}
.token{font:inherit;padding:8px 9px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.token.gewaehlt{border-color:var(--accent);background:var(--accent-soft)}
.token.richtig{border-color:var(--ok);background:var(--ok-soft)} .token.falsch{border-color:var(--bad);background:var(--bad-soft)}
.ende-info{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:3px}
.rueck{border-radius:12px;padding:12px 14px;font-size:15px}
.rueck.ok{background:var(--ok-soft)} .rueck.bad{background:var(--bad-soft)}
.rueck b{display:block;margin-bottom:2px}
.ergebnis{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ergebnis small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0}
textarea.kopie{width:100%;min-height:120px;font:13px/1.45 var(--mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}

/* Zettel */
.suche{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.zl li{align-items:center}
.zl .knoepfe{display:flex;gap:6px;flex:none}
.zl .zweit{padding:7px 10px;font-size:13px}
.treffer{font-size:13px;color:var(--muted);margin-top:2px}
.treffer mark{background:color-mix(in srgb,var(--wackelig) 35%,transparent);color:inherit;border-radius:3px}
#leser{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch}
#leser .leiste{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#leser .inhalt{max-width:680px;margin:0 auto;padding-block:16px calc(40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:15px;line-height:1.55}
#leser .inhalt p,#leser .inhalt ul,#leser .inhalt ol{margin:0 0 .8em}
#leser .inhalt .tabwrap{overflow-x:auto;margin:0 0 .9em}
#leser .inhalt details{margin:0 0 .8em;padding:.5em .8em;border:1px solid var(--line);border-radius:.8em}

/* Leiste unten */
#ziehen{position:fixed;top:0;left:50%;transform:translate(-50%,-50px);opacity:0;z-index:50;transition:transform .15s,opacity .15s;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.ziehen-kreis{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:18px;color:var(--muted);transition:transform .2s}
#ziehen.bereit .ziehen-kreis{transform:rotate(180deg);color:var(--accent)}
#ziehen.dreht .ziehen-kreis{animation:kkdreh .8s linear infinite;color:var(--accent)}
@keyframes kkdreh{to{transform:rotate(360deg)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
